<!DOCTYPE html>
<!-- <!DOCTYPE html> HTML5 文档类型声明，告诉浏览器用标准模式解析 -->
<!-- lang="zh-CN" 声明页面语言为简体中文，利于搜索引擎与无障碍 -->
<html lang="zh-CN">
<head>
  <!-- <meta charset="UTF-8"> 字符编码声明，UTF-8 支持中文，避免乱码 -->
  <!-- viewport 移动端视口设置，width=device-width 按设备宽度，initial-scale=1 不缩放 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- <title> 浏览器标签页标题，影响 SEO -->
  <title>工作台 - 园区后台管理系统</title>
  <!-- <link rel="stylesheet"> 引入外部 CSS；先公共再页面样式 -->
  <!-- 加载顺序：common.css 先于 index.css，保证页面样式能覆盖公共样式 -->
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="layout">
    <!-- ============ 侧边导航栏 ============ -->
    <!-- <aside> 语义标签：语义化标签，表示侧边附属内容 -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">
          <!-- 园区 LOGO（SVG，非 emoji） -->
          <!-- <svg> 内嵌矢量图形，放大不模糊；fill 设置填充色 -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#1677ff"><path d="M3 21h18v-2H3v2zM6 18h2V9H6v9zm5 0h2V5h-2v13zm5 0h2v-7h-2v7z"/></svg>
        </span>
        <span class="logo-text">园区后台管理</span>
      </div>
      <!-- <nav> 语义标签：表示导航区域 -->
      <nav class="menu">
        <!-- 工作台（直链） -->
        <div class="menu-item">
          <!-- onclick 内联事件：直接在 HTML 属性里绑定点击跳转 -->
          <div class="menu-title" onclick="location.href='index.html'">
            <span class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></span>
            <span class="menu-text">工作台</span>
          </div>
        </div>
        <!-- 月卡管理（可折叠子菜单） -->
        <div class="menu-item has-sub open">
          <div class="menu-title">
            <span class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg></span>
            <span class="menu-text">月卡管理</span>
            <span class="menu-arrow">▶</span>
          </div>
          <ul class="submenu">
            <li><a href="monthCard.html">月卡列表</a></li>
            <li><a href="addMonthCard.html">新增月卡</a></li>
          </ul>
        </div>
        <!-- 系统管理（扩展占位） -->
        <div class="menu-item has-sub">
          <div class="menu-title">
            <span class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></span>
            <span class="menu-text">系统管理</span>
            <span class="menu-arrow">▶</span>
          </div>
          <ul class="submenu">
            <li><a href="javascript:void(0)">用户管理</a></li>
            <li><a href="javascript:void(0)">角色管理</a></li>
          </ul>
        </div>
      </nav>
    </aside>

    <!-- ============ 主区域 ============ -->
    <div class="main">
      <!-- 顶部头部 -->
      <header class="header">
        <span class="collapse-btn" title="折叠/展开">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
        </span>
        <span class="breadcrumb">首页 / 工作台</span>
        <div class="account">
          <span class="avatar">管</span>
          <span>管理员</span>
        </div>
      </header>

      <!-- 内容区 -->
      <div class="content">
        <!-- 统计卡片：4 项 -->
        <div class="stat-grid">
          <div class="stat-card">
            <!-- 内联 style：style 属性写行内样式，优先级最高；背景与图标色分开设 -->
            <div class="stat-icon" style="background:#e8f4ff;color:#1677ff;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18 17h-2v2h2v-2zm0-4h-2v2h2v-2zm-4 4h-2v2h2v-2zm0-4h-2v2h2v-2zm-4 4H8v2h2v-2zm0-4H8v2h2v-2zM5 5h14c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2h-3v2h-2v-2h-4v2H8v-2H5c-1.1 0-2-.9-2-2V7c0-1.1.9-2 2-2zm0 2v2h14V7H5zm0 4v6h14v-6H5z"/></svg>
            </div>
            <div class="stat-info">
              <div class="stat-label">月卡车辆总数</div>
              <!-- id 属性：唯一标识元素，JS 用 getElementById 取它动态填值 -->
              <div class="stat-value" id="statCardTotal">0</div>
              <div class="stat-sub">单位：辆</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon" style="background:#fff7e6;color:#fa8c16;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M11 8v5h5V8h-5zm-6 5h5V8H5v5zm0 6h5v-5H5v5zm6 0h5v-5h-5v5zm6 0h.01zM16 8v5h3V8h-3zM5 18v2h14v-2H5z"/></svg>
            </div>
            <div class="stat-info">
              <div class="stat-label">年度累计收费</div>
              <div class="stat-value" id="statAnnualFee">0</div>
              <div class="stat-sub">单位：元</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon" style="background:#f6ffed;color:#52c41a;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm6 12H8v-2h4v2zm0-4H8v-2h4v2zm0-4H8V9h4v2zm0-4H8V5h4v2zm8 12h-6v-2h6v2zm0-4h-6v-2h6v2zm0-4h-6V9h6v2zm0-4h-6V5h6v2z"/></svg>
            </div>
            <div class="stat-info">
              <div class="stat-label">入驻企业总数</div>
              <div class="stat-value" id="statCompany">0</div>
              <div class="stat-sub">单位：家</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon" style="background:#fff0f6;color:#eb2f96;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M4 22V3h6v19H4zm10 0V3h6v19h-6z"/></svg>
            </div>
            <div class="stat-info">
              <div class="stat-label">一体杆总数</div>
              <div class="stat-value" id="statPole">0</div>
              <div class="stat-sub">单位：台</div>
            </div>
          </div>
        </div>

        <!-- 快捷入口 -->
        <div class="card">
          <div class="card-header">快捷入口</div>
          <div class="card-body quick-entry">
            <a class="entry-item" href="addMonthCard.html">
              <span class="entry-icon" style="background:#e8f4ff;color:#1677ff;">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
              </span>
              <span>新增月卡</span>
            </a>
            <a class="entry-item" href="monthCard.html">
              <span class="entry-icon" style="background:#f6ffed;color:#52c41a;">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h18v2H4V5zm0 5h18v2H4v-2zm0 5h18v2H4v-2zm0 5h12v2H4v-2z"/></svg>
              </span>
              <span>月卡列表</span>
            </a>
          </div>
        </div>

        <!-- 扩展占位容器（预留） -->
        <div class="card">
          <div class="card-header">数据概览
            <span class="card-sub">更多图表敬请期待</span>
          </div>
          <div class="card-body placeholder">
            <div class="placeholder-box">此处为扩展占位容器，后续可接入图表/统计组件</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- <script src> 引入外部 JS；放 body 末尾，DOM 已加载完毕 -->
  <!-- 加载顺序：common.js 先（提供公共函数），index.js 后（页面逻辑） -->
  <script src="common.js"></script>
  <script src="index.js"></script>
</body>
</html>
