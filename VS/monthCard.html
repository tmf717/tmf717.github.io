<!DOCTYPE html>
<!-- <!DOCTYPE html> HTML5 文档类型声明，告诉浏览器用标准模式解析 -->
<!-- lang="zh-CN" 声明页面语言为简体中文，利于搜索引擎与无障碍 -->
<html lang="zh-CN">
<head>
  <!-- <meta charset="UTF-8"> 字符编码声明，UTF-8 支持中文，避免乱码 -->
  <!-- viewport 移动端视口设置，width=device-width 按设备宽度，initial-scale=1 不缩放 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- <title> 浏览器标签页标题，影响 SEO -->
  <title>月卡管理列表 - 园区后台管理系统</title>
  <!-- <link rel="stylesheet"> 引入外部 CSS；先公共再页面样式 -->
  <!-- 加载顺序：common.css 先于 monthCard.css，保证页面样式能覆盖公共样式 -->
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="monthCard.css">
</head>
<body>
  <!-- <div class="layout"> 布局容器，common.css 用 flex 横向排列侧边栏与主区域 -->
  <div class="layout">
    <!-- ============ 侧边导航栏（与首页一致） ============ -->
    <!-- <aside> 语义标签：语义化标签，表示侧边附属内容 -->
    <aside class="sidebar">
      <div class="logo">
        <!-- <svg> 内嵌矢量图形，放大不模糊；fill 设置填充色 -->
        <span class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#1677ff"><path d="M3 21h18v-2H3v2zM6 18h2V9H6v9zm5 0h2V5h-2v13zm5 0h2v-7h-2v7z"/></svg>
        </span>
        <span class="logo-text">园区后台管理</span>
      </div>
      <!-- <nav> 语义标签：表示导航区域 -->
      <nav class="menu">
        <!-- 工作台（直链） -->
        <div class="menu-item">
          <!-- onclick 内联事件：直接在 HTML 属性里绑定点击跳转 -->
          <div class="menu-title" onclick="location.href='index.html'">
            <span class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></span>
            <span class="menu-text">工作台</span>
          </div>
        </div>
        <!-- 月卡管理（可折叠子菜单） -->
        <div class="menu-item has-sub open">
          <div class="menu-title">
            <span class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg></span>
            <span class="menu-text">月卡管理</span>
            <span class="menu-arrow">▶</span>
          </div>
          <!-- <ul>+<li>+<a> 无序列表做子菜单；href 指向页面地址 -->
          <ul class="submenu">
            <li><a href="monthCard.html">月卡列表</a></li>
            <li><a href="addMonthCard.html">新增月卡</a></li>
          </ul>
        </div>
        <!-- 系统管理（扩展占位） -->
        <div class="menu-item has-sub">
          <div class="menu-title">
            <span class="menu-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></span>
            <span class="menu-text">系统管理</span>
            <span class="menu-arrow">▶</span>
          </div>
          <ul class="submenu">
            <!-- javascript:void(0) 占位链接，不跳转，仅维持 a 标签样式 -->
            <li><a href="javascript:void(0)">用户管理</a></li>
            <li><a href="javascript:void(0)">角色管理</a></li>
          </ul>
        </div>
      </nav>
    </aside>

    <!-- ============ 主区域 ============ -->
    <div class="main">
      <!-- <header> 语义标签：页面顶部区域 -->
      <header class="header">
        <!-- title 属性：鼠标悬停显示提示文字（tooltip） -->
        <span class="collapse-btn" title="折叠/展开">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
        </span>
        <span class="breadcrumb">月卡管理 / 月卡列表</span>
        <div class="account">
          <span class="avatar">管</span>
          <span>管理员</span>
        </div>
      </header>

      <!-- <div class="content"> 内容区，common.css 用 overflow:auto 滚动 -->
      <div class="content">
        <!-- 查询筛选区域 -->
        <div class="card">
          <div class="card-body filter-bar">
            <div class="filter-item">
              <!-- <label> 表单字段说明文字 -->
              <!-- <input> 文本框：type 默认 text；placeholder 占位提示 -->
              <!-- id 属性：唯一标识，JS 用 getElementById 取值 -->
              <label>车主姓名</label>
              <input class="input" id="filterOwner" placeholder="请输入车主姓名">
            </div>
            <div class="filter-item">
              <label>车牌号</label>
              <input class="input" id="filterPlate" placeholder="请输入车牌号">
            </div>
            <div class="filter-item">
              <!-- <select>+<option> 下拉框；value 是提交值，文本是显示值 -->
              <!-- <option value=""> 空 value 表示"全部"，JS 判断空串跳过该条件 -->
              <label>状态</label>
              <select class="select" id="filterStatus">
                <option value="">全部</option>
                <option value="0">可用</option>
                <option value="1">已过期</option>
              </select>
            </div>
            <div class="filter-actions">
              <!-- <button> 按钮；class 组合公共样式 btn + 变体 btn-primary -->
              <!-- id：JS 通过 id 绑定 onclick 事件 -->
              <button class="btn btn-primary" id="btnSearch">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
                查询
              </button>
              <button class="btn" id="btnReset">重置</button>
            </div>
          </div>
        </div>

        <!-- 操作按钮 + 表格 -->
        <div class="card">
          <div class="card-header card-toolbar">
            <span>月卡列表</span>
            <div class="toolbar-btns">
              <button class="btn btn-primary" id="btnAdd">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                添加月卡
              </button>
              <button class="btn btn-danger" id="btnBatchDel">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                批量删除
              </button>
            </div>
          </div>
          <!-- table-wrap 表格滚动容器，窄屏时 overflow-x:auto 横向滚动 -->
          <div class="table-wrap">
            <!-- <table> 表格语义：thead 表头、tbody 表体、tr 行、th/td 单元格 -->
            <!-- border-collapse:collapse 在 common.css 中设置，合并相邻边框避免双线 -->
            <table class="table">
              <thead>
                <tr>
                  <!-- <input type="checkbox"> 复选框；id="checkAll" 表头全选 -->
                  <!-- style 行内样式：width:44px 固定列宽，优先级高于外部 CSS -->
                  <th class="col-center" style="width:44px;"><input type="checkbox" id="checkAll"></th>
                  <th style="width:60px;">序号</th>
                  <th>车主姓名</th>
                  <th>手机号</th>
                  <th>车牌号</th>
                  <th>车辆类型</th>
                  <th>支付金额(元)</th>
                  <th>支付方式</th>
                  <th>开始日期</th>
                  <th>结束日期</th>
                  <th>剩余天数</th>
                  <th>状态</th>
                  <th style="width:200px;">操作</th>
                </tr>
              </thead>
              <!-- <tbody id="cardTbody"> 表体；JS 用 innerHTML 动态生成 <tr> -->
              <tbody id="cardTbody"><!-- JS 动态生成 --></tbody>
            </table>
          </div>

          <!-- 分页组件 -->
          <div class="pagination">
            <div class="page-info">
              <!-- <span id> 行内元素 + id，JS 用 textContent 动态填值 -->
              共 <span id="totalCount">0</span> 条，每页
              <select class="select page-size" id="pageSize">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="20">20</option>
              </select>
              条
            </div>
            <div class="page-btns">
              <!-- disabled 属性：JS 设 btn.disabled=true 禁用按钮（第1页禁用上一页） -->
              <button class="btn btn-sm" id="btnPrev">上一页</button>
              <span class="page-num" id="pageNum">1 / 1</span>
              <button class="btn btn-sm" id="btnNext">下一页</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 复用弹窗：查看 / 编辑 / 续费 ============ -->
  <!-- modal-mask 遮罩层：position:fixed + inset:0 全屏半透明遮罩 -->
  <!-- display:none/flex 切换：JS 加 .show 类改为 flex 显示弹窗 -->
  <div class="modal-mask" id="cardModal">
    <div class="modal">
      <div class="modal-header">
        <!-- id="modalTitle"：JS 用 textContent 切换标题（查看/编辑/续费） -->
        <span id="modalTitle">查看月卡</span>
        <!-- HTML 实体 &times; 显示 × 关闭符号，比直接写 × 更规范 -->
        <span class="close-btn" id="modalClose">&times;</span>
      </div>
      <div class="modal-body">
        <!-- grid 两列布局：modal-grid 在 monthCard.css 用 grid 设 1fr 1fr 两列 -->
        <div class="modal-grid">
          <div class="form-row">
            <!-- <span class="required">*</span> 用 CSS 把 * 标红表示必填 -->
            <!-- <label class="label"> 表单字段说明，与 input 配对使用 -->
            <label class="label"><span class="required">*</span>车主姓名</label>
            <input class="input" id="mOwner">
            <!-- data-* 自定义属性：data-field 标记字段名 -->
            <!-- 属性选择器：JS 用 querySelector('.error-tip[data-field="..."]') 定位 -->
            <div class="error-tip" data-field="ownerName"></div>
          </div>
          <div class="form-row">
            <label class="label"><span class="required">*</span>手机号</label>
            <input class="input" id="mPhone">
            <div class="error-tip" data-field="phone"></div>
          </div>
          <div class="form-row">
            <label class="label"><span class="required">*</span>车牌号</label>
            <input class="input" id="mCard">
            <div class="error-tip" data-field="cardNumber"></div>
          </div>
          <div class="form-row">
            <label class="label"><span class="required">*</span>车辆类型</label>
            <!-- <select> JS 填充：初始无 option，JS 用 innerHTML 动态生成 -->
            <select class="select" id="mType"><!-- JS 填充 --></select>
            <div class="error-tip" data-field="vehicleType"></div>
          </div>
          <div class="form-row">
            <label class="label"><span class="required">*</span>支付金额(元)</label>
            <!-- type="number" 数字输入框，移动端弹数字键盘 -->
            <!-- min/step：min 最小值 0；step 步长 0.01 支持两位小数 -->
            <input class="input" id="mAmount" type="number" min="0" step="0.01">
            <div class="error-tip" data-field="payAmount"></div>
          </div>
          <div class="form-row">
            <label class="label"><span class="required">*</span>支付方式</label>
            <select class="select" id="mMethod"><!-- JS 填充 --></select>
            <div class="error-tip" data-field="payMethod"></div>
          </div>
          <div class="form-row">
            <label class="label"><span class="required">*</span>开始日期</label>
            <!-- type="date" 浏览器原生日期选择器，无需 JS 实现日历 -->
            <!-- value 格式：YYYY-MM-DD，JS 用 .value 取值 -->
            <input class="input" id="mStart" type="date">
            <div class="error-tip" data-field="startDate"></div>
          </div>
          <div class="form-row">
            <label class="label"><span class="required">*</span>结束日期</label>
            <input class="input" id="mEnd" type="date">
            <div class="error-tip" data-field="endDate"></div>
          </div>
          <div class="form-row">
            <label class="label">剩余有效天数</label>
            <!-- readonly 属性：只读，用户不能改，但 JS 可赋值 -->
            <!-- readonly vs disabled：readonly 值会随表单提交；disabled 不会 -->
            <input class="input" id="mRemain" readonly>
            <div class="error-tip"></div>
          </div>
          <div class="form-row">
            <label class="label">月卡状态</label>
            <input class="input" id="mStatus" readonly>
            <div class="error-tip"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="modalCancel">关闭</button>
        <!-- style="display:none" 行内隐藏元素，JS 改 display 显示 -->
        <!-- 弹窗复用：查看模式隐藏保存按钮；编辑/续费模式显示 -->
        <button class="btn btn-primary" id="modalSave" style="display:none;">保存</button>
      </div>
    </div>
  </div>

  <!-- <script src> 引入外部 JS；放 body 末尾，DOM 已加载完毕 -->
  <!-- 加载顺序：common.js 先（提供公共函数），monthCard.js 后（页面逻辑） -->
  <script src="common.js"></script>
  <script src="monthCard.js"></script>
</body>
</html>
